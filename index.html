
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook Assignment</title>
</head>

<body>
    <h1>My Guestbook</h1>
    <p>Welcome to my guestbook application!</p>

    <button id="githubLogin">Sign in with GitHub</button>
<p id="loginStatus">Not signed in</p>

    <h2>Leave a Message</h2>

<form id="messageForm">
    <label for="message">Your Message:</label>
    <br><br>

    <textarea id="message" rows="4" cols="40"></textarea>
    <br><br>

    <button type="submit">Post Message</button>
</form>
<hr>

<h2>Guestbook Messages</h2>

<div id="messagesList">
    <p>No messages yet.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
